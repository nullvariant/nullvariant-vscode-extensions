# Codecov Configuration for Monorepo
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
    patch:
      default:
        target: 90%

# Fix path mapping for monorepo structure
# Each package writes lcov.info with paths relative to its own directory:
# the extension's "src/commandAllowlist.ts" (via source maps) and the site's "build.mjs".
# These need to be mapped to full repository paths
fixes:
  - "src/::extensions/git-id-switcher/src/"
  - "build.mjs::site/build.mjs"

# Coverage per package, uploaded with the matching flag in ci.yml
flags:
  extension:
    paths:
      - extensions/git-id-switcher/src/
  site:
    paths:
      - site/

# Ignore test files from coverage
ignore:
  - "**/*.test.ts"
  - "**/*.test.mjs"
  - "**/test/**"
