packages:
  - extensions/*
# Wait 7 days (10080 minutes) before taking a freshly published version, so a hijacked or
# withdrawn release is not pulled in.
minimumReleaseAge: 10080
# Dependency build scripts (postinstall and the like) run the dependency author's code with the
# permissions of whoever installs. Every dependency that has one is denied, and an unreviewed
# one stops the install instead of being skipped silently.
allowBuilds:
  '@vscode/vsce-sign': false
strictDepBuilds: true
overrides:
  '@azure/identity>@azure/msal-node': ^7.1.0
  brace-expansion@1: ^1.1.13
  brace-expansion@2: ^2.0.3
  diff: ^8.0.3
  serialize-javascript: ^7.1.3
  yauzl: ^3.2.1
  glob: 14.0.3
  minimatch: 11.0.3
