# SonarCloud Configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=nullvariant_nullvariant-vscode-extensions
sonar.organization=nullvariant

# Source and test directories
# site/ is the variant.fit site; packages/eslint-config/ holds the shared ESLint rules
sonar.sources=extensions/git-id-switcher/src,site,packages/eslint-config
sonar.exclusions=**/test/**,**/*.test.mjs,**/node_modules/**,**/out/**,**/coverage/**,**/dist/**
sonar.tests=extensions/git-id-switcher/src/test,site
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.mjs

# Exclude test files and documentation from duplication detection
# Test code: duplication is acceptable for readability and isolation
# Documentation: multi-language versions SHOULD have identical structure
sonar.cpd.exclusions=**/test/**,**/*.test.ts,**/*.spec.ts,**/*.test.mjs,**/docs/**,**/README.md

# Coverage reports
sonar.javascript.lcov.reportPaths=extensions/git-id-switcher/coverage/lcov.info,site/coverage/lcov.info

# Exclude VS Code API dependent files from coverage analysis
# These files require VS Code runtime and cannot be unit tested
# List derived from actual coverage report with "all": true
# ESLint configuration (packages/eslint-config/, each eslint.config.mjs) runs on every lint, not under tests
sonar.coverage.exclusions=packages/eslint-config/**,**/eslint.config.mjs,**/documentation.ts,**/errors.ts,**/extension.ts,**/gitConfig.ts,**/identity.ts,**/quickPick.ts,**/sshAgent.ts,**/statusBar.ts,**/commands/**,**/services/**,**/ui/**

# Disable rule S2187 (test files should contain tests) for custom test runner
# This project uses a custom function-based test runner, not Jasmine/Mocha/Jest
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

# Disable rule S9382 (await inside a loop) for the interactive QuickPick loops only.
# Each iteration shows the next picker based on what the user did in the previous one
# (selected row, edited field), so the awaits are sequential by nature and cannot be
# batched with Promise.all. Loops over independent work are parallelized instead.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e2.resourceKey=extensions/git-id-switcher/src/commands/handlers.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e3.resourceKey=extensions/git-id-switcher/src/ui/identityAddForm.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e4.resourceKey=extensions/git-id-switcher/src/ui/identityEditFlow.ts

# Disable rule S9382 for the git config and record writes whose order is the specification:
# - repositoryCheck.ts: the walk up from the workspace folder stops at the nearest .git entry,
#   so whether to look at the next folder depends on the previous answer
# - repositoryConfigWriter.ts: a rollback puts the values back in reverse order, and the
#   records are removed one at a time (each write replaces all the stored records)
# - submodule.ts: submodules are written one at a time, since they share the record store
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e5.resourceKey=extensions/git-id-switcher/src/core/repositoryCheck.ts
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e6.resourceKey=extensions/git-id-switcher/src/core/repositoryConfigWriter.ts
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e7.resourceKey=extensions/git-id-switcher/src/core/submodule.ts

# Source encoding
sonar.sourceEncoding=UTF-8
