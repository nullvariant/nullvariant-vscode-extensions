name: Verified VSIX
description: >
  Download the release assets built by the build job and check that the VSIX
  is the exact file the build job recorded before the production approval.

inputs:
  version:
    description: Extension version (MAJOR.MINOR.PATCH, already validated by the build job)
    required: true
  sha256:
    description: SHA-256 of the VSIX recorded by the build job
    required: true
  artifact-id:
    description: ID of the release-assets artifact uploaded by the build job
    required: true

outputs:
  vsix:
    description: Path to the verified VSIX
    value: ${{ steps.verify.outputs.vsix }}

runs:
  using: composite
  steps:
    - name: Download release assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: release-assets
        # Extract straight into path; by-ID downloads otherwise add a subdirectory
        merge-multiple: true

    - name: Verify VSIX digest
      id: verify
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        vsix="release-assets/git-id-switcher-${VERSION}.vsix"
        actual=$(sha256sum "$vsix" | cut -d' ' -f1)
        if [ "$actual" != "$EXPECTED_SHA256" ]; then
          echo "::error::VSIX digest does not match the build job"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
