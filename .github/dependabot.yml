version: 2
updates:
  # GitHub Actions - keep SHA-pinned actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (workspaces monorepo - must use root for lockfile sync)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    # @types/vscode must match engines.vscode.
    # Bumping it forces engines.vscode up, cutting off fork editors
    # (Cursor, Windsurf, etc.) that lag behind VS Code stable.
    ignore:
      - dependency-name: "@types/vscode"
      # @types/node follows the Node.js version that VS Code runs extensions on,
      # not the latest Node.js major
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint cannot parse with TypeScript 7 yet (eslint crashes
      # on it). Lift this once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    # Group minor and patch updates together
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
