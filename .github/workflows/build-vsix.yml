name: Build VSIX

# Reusable workflow that builds, scans, signs, and attests the VSIX for a
# release tag. The build provenance is signed by this workflow, not by the
# workflow that calls it, so the caller's steps cannot reach the signing step
# (SLSA v1.0 Build Level 3 with GitHub artifact attestations). Inside it, the
# build job runs the dependency and build scripts without an OIDC token, and the
# sign job, which holds the token, runs no code from the repository: it signs
# only the VSIX whose SHA-256 the build job recorded. The publish jobs check the
# provenance with `--signer-workflow` pointing at this file before anything is
# shipped.
on:
  workflow_call:
    outputs:
      version:
        description: Extension version taken from the release tag
        value: ${{ jobs.build.outputs.version }}
      vsix-sha256:
        description: SHA-256 of the VSIX
        value: ${{ jobs.build.outputs.vsix-sha256 }}
      artifact-id:
        description: ID of the release-assets artifact
        value: ${{ jobs.sign.outputs.artifact-id }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Any repository can call a public reusable workflow. Attestations made there
    # name that repository as the source, so the publish jobs would reject them;
    # this condition keeps such a build from running at all
    if: github.repository == 'nullvariant/nullvariant-vscode-extensions'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix-sha256: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the tag commit can be checked against main
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from tag
        id: version
        # SECURITY: the tag name is interpolated into later steps, so accept only a plain
        # version that matches the packaged extension
        run: |
          version="${GITHUB_REF#refs/tags/git-id-switcher-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag version is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          package_version=$(jq -r '.version' extensions/git-id-switcher/package.json)
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag version does not match package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        # SECURITY: only commits that reached main through review may be published
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit is not on main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          # SECURITY: a release build never restores a cache that other runs could have written
          package-manager-cache: false

      # Install at root level for npm workspaces
      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile
        working-directory: extensions/git-id-switcher

      - name: Package extension
        run: npm run package
        working-directory: extensions/git-id-switcher

      # Supply Chain Security: Trivy VSIX scan (post-package, pre-publish)
      # Scans the packaged VSIX for known CVEs before any publishing step
      # Downloads Trivy directly from GitHub Releases to avoid get.trivy.dev
      # dependency (blocked by harden-runner egress policy)
      - name: Scan VSIX with Trivy
        env:
          TRIVY_VERSION: '0.69.3'
        run: |
          curl -sfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          chmod +x trivy
          ./trivy fs extensions/git-id-switcher \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --db-repository ghcr.io/aquasecurity/trivy-db:2
          rm -f trivy trivy.tar.gz

      # Supply Chain Security: SBOM generation (CycloneDX via Syft)
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: extensions/git-id-switcher
          artifact-name: sbom-cyclonedx.json
          output-file: extensions/git-id-switcher/sbom-cyclonedx.json
          format: cyclonedx-json
          # The github-release job attaches the SBOM; this job cannot write to Releases
          upload-release-assets: false

      # The publish jobs check this digest, and the approver can compare it in the run summary
      - name: Record VSIX digest
        id: digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256=$(sha256sum "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### git-id-switcher ${VERSION}"
            echo
            echo "- Tag commit: \`${GITHUB_SHA}\`"
            echo "- VSIX SHA-256: \`${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          if-no-files-found: error
          path: |
            extensions/git-id-switcher/*.vsix
            extensions/git-id-switcher/sbom-cyclonedx.json

  sign:
    needs: build
    runs-on: ubuntu-latest
    # Any repository can call a public reusable workflow. Attestations made there
    # name that repository as the source, so the publish jobs would reject them;
    # this condition keeps such a build from running at all
    if: github.repository == 'nullvariant/nullvariant-vscode-extensions'
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: extensions/git-id-switcher
          # Extract straight into path; by-ID downloads otherwise add a subdirectory
          merge-multiple: true

      # SECURITY: sign only the exact VSIX the build job recorded
      - name: Verify VSIX digest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.vsix-sha256 }}
        run: |
          actual=$(sha256sum "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::VSIX digest does not match the build job"
            exit 1
          fi

      # Supply Chain Security: Cosign keyless signing for VSIX
      # Uses GitHub OIDC token (no secret key management required)
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SECURITY: Cosign signing failure aborts the entire release.
      # Sigstore infrastructure is mature — failure indicates an anomaly.
      - name: Sign VSIX with Cosign (keyless)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cosign sign-blob "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix" \
            --yes \
            --bundle "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix.bundle"

      # Supply Chain Security: SBOM attestation (signed with GitHub Attestation API)
      - name: Attest SBOM
        id: sbom-attest
        continue-on-error: true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: extensions/git-id-switcher/*.vsix
          sbom-path: extensions/git-id-switcher/sbom-cyclonedx.json

      - name: Warn if SBOM attestation failed
        if: steps.sbom-attest.outcome == 'failure'
        run: echo "::warning::SBOM attestation failed. The SBOM will be included in the release without attestation."

      # SLSA Provenance: Generate attestation via GitHub Attestation API
      # This creates verifiable build provenance for supply chain security
      - name: Generate SLSA Provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extensions/git-id-switcher/*.vsix

      # Copy the provenance bundle to release assets for OpenSSF Scorecard detection
      # The bundle is also stored in GitHub Attestation API for `gh attestation verify`
      - name: Prepare provenance for release
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          DEST_PATH="extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix.intoto.jsonl"

          if [ -z "$BUNDLE_PATH" ]; then
            echo "::error::Provenance bundle path is empty"
            exit 1
          fi

          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error::Provenance bundle file not found: $BUNDLE_PATH"
            exit 1
          fi

          cp "$BUNDLE_PATH" "$DEST_PATH"
          echo "Provenance bundle copied to: $DEST_PATH"
          ls -la "$DEST_PATH"

      - name: Upload release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            extensions/git-id-switcher/*.vsix
            extensions/git-id-switcher/*.vsix.bundle
            extensions/git-id-switcher/*.intoto.jsonl
            extensions/git-id-switcher/sbom-cyclonedx.json
