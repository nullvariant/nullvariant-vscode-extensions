name: Publish Extension

on:
  push:
    tags:
      - 'git-id-switcher-v*'

permissions: {}

# The build job runs before the production approval and holds no publishing
# credentials. Each publish job waits for the approval and holds only its own
# destination's credential; the jobs that ship the VSIX first check it against
# the SHA-256 the build job recorded. A failed publish job can be re-run on its
# own (`gh run rerun --job <job-id>`) with the same build artifact, without
# publishing to the other destinations again. Every job keeps the egress
# allowlist that the single-job workflow used.
jobs:
  build:
    runs-on: ubuntu-latest
    # Prevent forks from publishing
    if: github.repository == 'nullvariant/nullvariant-vscode-extensions'
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix-sha256: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the tag commit can be checked against main
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from tag
        id: version
        # SECURITY: the tag name is interpolated into later steps, so accept only a plain
        # version that matches the packaged extension
        run: |
          version="${GITHUB_REF#refs/tags/git-id-switcher-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag version is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          package_version=$(jq -r '.version' extensions/git-id-switcher/package.json)
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag version does not match package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        # SECURITY: only commits that reached main through review may be published
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit is not on main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Install at root level for npm workspaces
      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile
        working-directory: extensions/git-id-switcher

      - name: Package extension
        run: npm run package
        working-directory: extensions/git-id-switcher

      # Supply Chain Security: Trivy VSIX scan (post-package, pre-publish)
      # Scans the packaged VSIX for known CVEs before any publishing step
      # Downloads Trivy directly from GitHub Releases to avoid get.trivy.dev
      # dependency (blocked by harden-runner egress policy)
      - name: Scan VSIX with Trivy
        env:
          TRIVY_VERSION: '0.69.3'
        run: |
          curl -sfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          chmod +x trivy
          ./trivy fs extensions/git-id-switcher \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --db-repository ghcr.io/aquasecurity/trivy-db:2
          rm -f trivy trivy.tar.gz

      # Supply Chain Security: Cosign keyless signing for VSIX
      # Uses GitHub OIDC token (no secret key management required)
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SECURITY: Cosign signing failure aborts the entire release.
      # Sigstore infrastructure is mature — failure indicates an anomaly.
      - name: Sign VSIX with Cosign (keyless)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cosign sign-blob "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix" \
            --yes \
            --bundle "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix.bundle"

      # Supply Chain Security: SBOM generation (CycloneDX via Syft)
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: extensions/git-id-switcher
          artifact-name: sbom-cyclonedx.json
          output-file: extensions/git-id-switcher/sbom-cyclonedx.json
          format: cyclonedx-json
          # The github-release job attaches the SBOM; this job cannot write to Releases
          upload-release-assets: false

      # Supply Chain Security: SBOM attestation (signed with GitHub Attestation API)
      - name: Attest SBOM
        id: sbom-attest
        continue-on-error: true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: extensions/git-id-switcher/*.vsix
          sbom-path: extensions/git-id-switcher/sbom-cyclonedx.json

      - name: Warn if SBOM attestation failed
        if: steps.sbom-attest.outcome == 'failure'
        run: echo "::warning::SBOM attestation failed. The SBOM will be included in the release without attestation."

      # SLSA Provenance: Generate attestation via GitHub Attestation API
      # This creates verifiable build provenance for supply chain security
      - name: Generate SLSA Provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: extensions/git-id-switcher/*.vsix

      # Copy the provenance bundle to release assets for OpenSSF Scorecard detection
      # The bundle is also stored in GitHub Attestation API for `gh attestation verify`
      - name: Prepare provenance for release
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEST_PATH="extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix.intoto.jsonl"

          if [ -z "$BUNDLE_PATH" ]; then
            echo "::error::Provenance bundle path is empty"
            exit 1
          fi

          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error::Provenance bundle file not found: $BUNDLE_PATH"
            exit 1
          fi

          cp "$BUNDLE_PATH" "$DEST_PATH"
          echo "Provenance bundle copied to: $DEST_PATH"
          ls -la "$DEST_PATH"

      # The publish jobs check this digest, and the approver can compare it in the run summary
      - name: Record VSIX digest
        id: digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256=$(sha256sum "extensions/git-id-switcher/git-id-switcher-${VERSION}.vsix" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### git-id-switcher ${VERSION}"
            echo
            echo "- Tag commit: \`${GITHUB_SHA}\`"
            echo "- VSIX SHA-256: \`${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            extensions/git-id-switcher/*.vsix
            extensions/git-id-switcher/*.vsix.bundle
            extensions/git-id-switcher/*.intoto.jsonl
            extensions/git-id-switcher/sbom-cyclonedx.json

  github-release:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Get verified VSIX
        uses: ./.github/actions/verified-vsix
        with:
          version: ${{ needs.build.outputs.version }}
          sha256: ${{ needs.build.outputs.vsix-sha256 }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            release-assets/*.vsix
            release-assets/*.intoto.jsonl
            release-assets/sbom-cyclonedx.json
            release-assets/*.vsix.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  marketplace:
    needs: build
    if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      # SECURITY: the publishing CLI comes from the lockfile, and no dependency
      # install scripts run in a job that holds the publishing token
      - name: Install publishing CLI
        run: npm ci --ignore-scripts

      - name: Get verified VSIX
        id: vsix
        uses: ./.github/actions/verified-vsix
        with:
          version: ${{ needs.build.outputs.version }}
          sha256: ${{ needs.build.outputs.vsix-sha256 }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.vsix.outputs.vsix }}
        run: npx --no-install vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"

  open-vsx:
    needs: build
    if: ${{ vars.PUBLISH_TO_OPENVSX == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Get verified VSIX
        id: vsix
        uses: ./.github/actions/verified-vsix
        with:
          version: ${{ needs.build.outputs.version }}
          sha256: ${{ needs.build.outputs.vsix-sha256 }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.vsix.outputs.vsix }}
        # ovsx is not a project dependency (EPL-2.0 would add a license finding),
        # so pin the exact version the releases use
        run: npx --yes ovsx@1.3.0 publish "$VSIX" -p "$OVSX_PAT"

  docs:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      # The documents are taken from the tag commit, which the build job verified
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Deploy documentation to R2
        run: |
          R2_BASE="kura/nullvariant.com/nullvariant-vscode-extensions"
          EXT_PATH="extensions/git-id-switcher"

          # Upload all language READMEs from docs/i18n/ (including en/)
          for lang_dir in ${EXT_PATH}/docs/i18n/*/; do
            lang=$(basename "$lang_dir")
            echo "Deploying ${lang}/README.md..."
            npx wrangler@4.54.0 r2 object put "${R2_BASE}/${EXT_PATH}/docs/i18n/${lang}/README.md" \
              --file "${lang_dir}README.md" \
              --content-type "text/markdown; charset=utf-8" \
              --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
