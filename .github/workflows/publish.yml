name: Publish Extension

on:
  push:
    tags:
      - 'git-id-switcher-v*'

permissions: {}

# The build job runs before the production approval and holds no publishing
# credentials. It calls the reusable build-vsix.yml workflow, which signs the
# build provenance. Each publish job waits for the approval; all of them use the
# production environment, but each publishing step passes only its own
# destination's credential. The jobs that ship the VSIX first check it against
# the SHA-256 the build job recorded and verify its build provenance. A failed
# publish job can be re-run on its own (`gh run rerun --job <job-id>`) with the
# same build artifact, without publishing to the other destinations again. Every
# job, including the build workflow, uses the same egress allowlist.
jobs:
  build:
    # Prevent forks from publishing
    if: github.repository == 'nullvariant/nullvariant-vscode-extensions'
    uses: $/.github/workflows/build-vsix.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  github-release:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Get verified VSIX
        uses: $/.github/actions/verified-vsix
        with:
          version: ${{ needs.build.outputs.version }}
          sha256: ${{ needs.build.outputs.vsix-sha256 }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/*.vsix
            release-assets/*.intoto.jsonl
            release-assets/sbom-cyclonedx.json
            release-assets/*.vsix.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  marketplace:
    needs: build
    if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          # SECURITY: no cache in a job that holds the publishing token
          package-manager-cache: false

      # SECURITY: the publishing CLI comes from the lockfile, and no dependency
      # install scripts run in a job that holds the publishing token
      - name: Install publishing CLI
        run: npm ci --ignore-scripts

      - name: Get verified VSIX
        id: vsix
        uses: $/.github/actions/verified-vsix
        with:
          version: ${{ needs.build.outputs.version }}
          sha256: ${{ needs.build.outputs.vsix-sha256 }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.vsix.outputs.vsix }}
        run: npx --no-install vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"

  open-vsx:
    needs: build
    if: ${{ vars.PUBLISH_TO_OPENVSX == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      - name: Get verified VSIX
        id: vsix
        uses: $/.github/actions/verified-vsix
        with:
          version: ${{ needs.build.outputs.version }}
          sha256: ${{ needs.build.outputs.vsix-sha256 }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}

      # Calls the Open VSX REST API that ovsx uses, so no CLI or dependency runs in
      # a job that holds the token. open-vsx.org (v1.2.0) reads the token from the
      # query; newer registries read the header. Both go through curl's config on
      # stdin so the token never appears in the process arguments.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.vsix.outputs.vsix }}
        run: |
          response=$(printf 'url = "https://open-vsx.org/api/-/publish?token=%s"\nheader = "Authorization: Bearer %s"\n' "$OVSX_PAT" "$OVSX_PAT" \
            | curl -sS -K - -X POST \
                -H 'Content-Type: application/octet-stream' \
                --data-binary "@${VSIX}" \
                -w '\n%{http_code}')
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          error=$(jq -r '.error // empty' <<< "$body" 2>/dev/null || echo "unreadable response")
          if [ "$status" -lt 200 ] || [ "$status" -gt 299 ] || [ -n "$error" ]; then
            echo "::error::Open VSX publish failed (HTTP ${status}): ${error}"
            exit 1
          fi
          echo "Published $(jq -r '"\(.namespace).\(.name) \(.version)"' <<< "$body") to Open VSX"
  docs:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            marketplace.visualstudio.com:443
            oauth2.sigstore.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            open-vsx.org:443
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            uploads.github.com:443

      # The documents are taken from the tag commit, which the build job verified
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Deploy documentation to R2
        run: |
          R2_BASE="kura/nullvariant.com/nullvariant-vscode-extensions"
          EXT_PATH="extensions/git-id-switcher"

          # Upload all language READMEs from docs/i18n/ (including en/)
          for lang_dir in ${EXT_PATH}/docs/i18n/*/; do
            lang=$(basename "$lang_dir")
            echo "Deploying ${lang}/README.md..."
            npx wrangler@4.54.0 r2 object put "${R2_BASE}/${EXT_PATH}/docs/i18n/${lang}/README.md" \
              --file "${lang_dir}README.md" \
              --content-type "text/markdown; charset=utf-8" \
              --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
